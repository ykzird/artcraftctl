name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --version | head -2
      - name: shellcheck -S style
        run: shellcheck -S style artcraftctl tests/run.sh
      - name: bash -n
        run: bash -n artcraftctl && bash -n tests/run.sh

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show environment
        run: |
          bash --version | head -1
          uname -m
      - name: sandbox suite
        run: bash tests/run.sh
